services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop-lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - lab_access
      - lab_internal

networks:
  lab_access:
    driver: bridge

  lab_internal:
    driver: bridge
    internal: true
